    - generic [ref=e1565]:
      - generic [ref=e1567]:
        - generic [ref=e1568]: What is Awesomic?
        - paragraph [ref=e1572]: Awesomic is a revolutionary app that matches companies with vetted professionals across 30+ skill sets, from design and development to marketing and product. Based in San Francisco with a global core team, we offer a faster and more flexible alternative to traditional hiring through a subscription-based model. Awesomic delivers high-quality talent on demand, without the delays of recruiting.
      - generic [ref=e1574]:
        - generic [ref=e1575]: How does Awesomic work?
        - paragraph [ref=e1579]: We function as a subscription-based service that matches you to top-tier, vetted talent. Submit a project in just a few clicks and start receiving deliverables in as little as 24 hours. Scale your Awesomic plan up or down as your business needs change.
      - generic [ref=e1581]:
        - generic [ref=e1582]: How many revisions can I request for a project?
        - paragraph [ref=e1586]:
          - text: Every Awesomic subscription comes with
          - strong [ref=e1587]: unlimited revisions
          - text: . You receive daily progress updates via the app, and you can provide feedback or request iterations as needed. If your project requires a different approach, you can request a
          - strong [ref=e1588]: talent rematch at any time
          - text: ", at no extra cost. You can also add teammates to collaborate and streamline feedback"
      - generic [ref=e1590]:
        - generic [ref=e1591]: What’s a talent marketplace?
        - paragraph [ref=e1595]: A talent marketplace is a platform that utilizes data and intelligent matching algorithms to connect professionals with projects based on their skills, experience, and availability. While often used internally by large companies, Awesomic applies this model at scale, matching vetted global talent to your most critical business needs.
      - generic [ref=e1597]:
        - generic [ref=e1598]: Why choose Awesomic over traditional hiring or freelancing platforms?
        - paragraph [ref=e1602]: Hiring is time-consuming, expensive, and risky. Awesomic eliminates that problem. We rigorously vet all talent for technical ability, communication, and soft skills, ensuring only senior-level professionals work on your projects. You skip the job posts, interviews, and delays, and get straight to results.
      - generic [ref=e1604]:
        - generic [ref=e1605]: Is Awesomic just a design subscription service?
        - paragraph [ref=e1609]: No, Awesomic goes beyond design. While many clients utilize us for branding, UI/UX design, or motion graphics, we also provide vetted talent in no-code web development, product design, marketing, and more. Think of us as an extension of your team. A flexible, high-performing creative partner from planning to execution, whether you're building awesome products or scaling your team.
      - generic [ref=e1611]:
        - generic [ref=e1612]: How does communication with Awesomic work?
        - paragraph [ref=e1616]: You can talk directly with your matched talent via the Awesomic app, connect via Slack, email, or schedule video calls. No matter the plan, you’ll receive daily updates in the app for every active task. You can also tag us in for any issues through our in-app customer chat.
